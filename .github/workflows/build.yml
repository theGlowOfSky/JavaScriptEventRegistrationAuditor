name: build
on:
  push: { branches: [ main ] }
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore JavaScriptEventRegistrationAuditor.sln
      - run: dotnet build JavaScriptEventRegistrationAuditor.sln -c Release --no-restore
      - run: dotnet test JavaScriptEventRegistrationAuditor.sln -c Release --no-build
      - name: Stage plugin package folder
        shell: pwsh
        run: ./build/Package-Plugin.ps1
      - uses: actions/upload-artifact@v4
        with: { name: plugin-package, path: artifacts/package/** }
